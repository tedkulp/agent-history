# One lockstep vX.Y.Z tag releases the Collector archives and the Hub image
# (README.md §5). CI runs `goreleaser release --snapshot`, which
# builds all of it and publishes nothing.
version: 2

project_name: agent-history

before:
  hooks:
    - go generate ./...

builds:
  - id: collector
    main: ./cmd/collector
    binary: agent-history
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w -X github.com/tedkulp/agent-history/internal/buildinfo.Version={{ .Version }}
  - id: hub
    main: ./cmd/hub
    binary: agent-history-hub
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags

# Collector archives only: mise's github: backend must find exactly one asset
# per platform, so the Hub binary ships in the image and nowhere else.
archives:
  - ids: [collector]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

dockers_v2:
  - ids: [hub]
    dockerfile: Dockerfile
    images: [ghcr.io/tedkulp/agent-history-hub]
    platforms: [linux/amd64, linux/arm64]
    # An rc tag gets only its own image tag; vX.Y and latest stay put.
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: https://github.com/tedkulp/agent-history
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# Release notes come from CHANGELOG.md (--release-notes in release.yml).
# The changelog pipe must stay enabled: it is what reads that file, and
# `disable: true` publishes a release with empty notes.
changelog:
  use: git

release:
  prerelease: auto
