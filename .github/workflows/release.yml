# A human-pushed vX.Y.Z (or vX.Y.Z-rc.N) tag publishes the Collector archives
# and the Hub image in lockstep (README.md §5).
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Must match dockers_v2.images in .goreleaser.yaml.
      IMAGE: ghcr.io/tedkulp/agent-history-hub
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Fails before anything is published when MinCollectorVersion is above
      # the tag's version (README.md §5.4).
      - run: go run ./internal/release/floorcheck "$GITHUB_REF_NAME"
      # Fails before anything is published when CHANGELOG.md has no section
      # for the tag; that section becomes the GitHub Release notes.
      - run: go run ./internal/release/notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - id: image
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
